name: Déploiement

on:
  push:
    branches: [master]
  workflow_dispatch:

# Un déploiement à la fois ; un push pendant un déploiement attend son tour.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Générer le site dans dist/
        run: python3 build.py

      - name: Déployer le Worker mon-chat-peut
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
