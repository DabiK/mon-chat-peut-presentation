name = "mon-chat-peut"
compatibility_date = "2026-10-01"
# Adresse de secours, en plus du domaine.
workers_dev = true

# Aucun script : le Worker sert seulement les fichiers de dist/, générés par `python3 build.py`.
# Le cache des images et des polices est réglé dans _headers.
[assets]
directory = "./dist"

# Le DNS de mon-chat-peut.com reste chez Hostinger : le domaine pointe vers mon-chat-peut-saas.pasdansmonfil.fr
# (ALIAS à la racine, CNAME pour www). Les deux noms sont des noms de domaine personnalisés Cloudflare for SaaS
# de la zone pasdansmonfil.fr, d'où la route dans cette zone. www est redirigé vers le domaine nu par une règle
# de redirection de la zone, avant d'arriver au Worker.
[[routes]]
pattern = "mon-chat-peut.com/*"
zone_name = "pasdansmonfil.fr"
