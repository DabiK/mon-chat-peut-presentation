<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{share_title}}</title>
<meta name="description" content="{{share_description}}">
<!-- Page du lien en bio (TikTok) : hors des moteurs de recherche, ses liens restent suivis. -->
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#FFF4E8">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mon chat peut ?">
<meta property="og:locale" content="{{locale}}">
<meta property="og:url" content="{{page_url}}">
<meta property="og:title" content="{{share_title}}">
<meta property="og:description" content="{{share_description}}">
<meta property="og:image" content="https://mon-chat-peut.com{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="/assets/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Le store du téléphone passe en premier, avant le premier affichage. -->
<script>(function(){var u=navigator.userAgent,d=document.documentElement;if(/iPhone|iPad|iPod/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1))d.classList.add("ios");else if(/Android/.test(u))d.classList.add("android")})()</script>
<style>
{{css}}
</style>
</head>
<body class="share">
<!-- Page générée par build.py à partir de src/share.html : modifier src/, puis lancer python3 build.py -->
<main class="share-main">
  <div class="share-top">
    <a class="lang" href="{{lang_href}}" hreflang="{{lang_other}}" lang="{{lang_other}}" aria-label="{{lang_label}}">{{lang_code}}</a>
  </div>

  <header class="share-head">
    <div class="share-vivi" aria-hidden="true">
      <img src="/img/vivi-final.webp" width="400" height="352" alt="" fetchpriority="high">
      <span class="stamp" id="stamp" data-v="{{share_stamp_v}}"><small id="stamp-food">{{share_stamp_food}}</small><b id="stamp-word">{{share_stamp_word}}</b></span>
    </div>
    <p class="eyebrow">{{share_kicker}}</p>
    <h1 class="share-name">Mon chat peut<img src="/img/logo.webp" width="81" height="120" alt="?"></h1>
    <p class="share-tagline">{{share_tagline}}</p>
  </header>

  <nav class="share-stores" aria-label="{{share_stores}}">
    <a class="store-btn s-ios" href="{{share_apple_href}}" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
      <span><small>{{share_get_ios}}</small><b>App Store</b></span>
      <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a class="store-btn s-android" href="{{share_play_href}}" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z"/></svg>
      <span><small>{{share_get_android}}</small><b>Google Play</b></span>
      <svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </nav>

  <section class="share-quick" aria-labelledby="quick-title">
    <h2 class="eyebrow" id="quick-title">{{share_quick}}</h2>
    <ul>{{share_quick_html}}</ul>
  </section>
</main>

<footer class="share-foot">
  <a href="{{home_href}}">{{share_site}}</a>
  <a href="{{legal_privacy_href}}">{{legal_privacy}}</a>
  <a href="{{lang_href}}" hreflang="{{lang_other}}" lang="{{lang_other}}">{{lang_name}}</a>
</footer>

<script type="application/json" id="stamps">{{share_stamps_json}}</script>
<script>
// Le tampon passe d'un aliment à l'autre, comme dans l'app.
(function () {
  var list = JSON.parse(document.getElementById("stamps").textContent), i = 0;
  var stamp = document.getElementById("stamp"), food = document.getElementById("stamp-food"), word = document.getElementById("stamp-word");
  if (list.length < 2) return;
  setInterval(function () {
    if (document.hidden) return;
    i = (i + 1) % list.length;
    food.textContent = list[i][0]; word.textContent = list[i][2]; stamp.dataset.v = list[i][1];
    stamp.classList.remove("thump"); void stamp.offsetWidth; stamp.classList.add("thump");
  }, 2400);
})();
</script>
</body>
</html>
